[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "image-model-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.135.1", "uvicorn==0.41.0", "pydantic==2.12.5",
  "docker==7.1.0", "python-multipart==0.0.22", "pillow==12.1.1",
  "huggingface-hub==0.36.2",
]

[project.optional-dependencies]
test = ["pytest==9.0.2", "httpx==0.28.1", "ruff==0.15.5"]

[tool.setuptools.packages.find]
include = ["image_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
